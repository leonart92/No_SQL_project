name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGO_URI: mongodb://localhost:27018

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Node.js (needed for the MongoDB Shell)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the MongoDB Shell
        run: npm install -g mongosh

      - name: Install the Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Run DBScript.txt on the empty database
        run: mongosh "$MONGO_URI" --file DBScript.txt

      - name: Run the tests
        run: pytest tests/ -v
